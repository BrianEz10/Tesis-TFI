# /etc/syslog-ng/conf.d/soc-lab.conf
# Configuración de recolección del laboratorio SOC.
# Recibe logs por red (TCP/UDP 514) y de la fuente local del sistema,
# y los escribe con formato ISODATE en el archivo que n8n consulta.

source s_soclab_net {
    network(transport(tcp) port(514));
    network(transport(udp) port(514));
};

destination d_alerts {
    file("/var/log/security/alerts.log"
        template("${ISODATE} ${HOST} ${PROGRAM} ${MESSAGE}\n")
        perm(0644)
    );
};

# NOTA: la fuente local correcta en Ubuntu 24.04 es s_src (no s_local).
log { source(s_soclab_net); source(s_src); destination(d_alerts); };
