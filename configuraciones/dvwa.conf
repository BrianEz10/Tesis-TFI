# /etc/syslog-ng/conf.d/dvwa.conf
# Integra el log de acceso de Apache (contenedor DVWA) al pipeline.
# Alimenta las reglas RD-4 (inyección SQL) y RD-5 (directory traversal).

source s_dvwa_access {
    file("/home/ubuntu/dvwa-logs/access.log" follow-freq(1));
};

destination d_alerts_dvwa {
    file("/var/log/security/alerts.log"
        template("${ISODATE} dvwa-web apache-access ${MESSAGE}\n")
        persist-name("d_alerts_dvwa")
        perm(0644)
    );
};

# NOTA: persist-name y perm explícitos son obligatorios cuando dos destinos
# escriben al mismo archivo, para evitar conflictos de arranque de Syslog-ng.
log { source(s_dvwa_access); destination(d_alerts_dvwa); };
